<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datasets</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-6xl mx-auto px-6 py-4">
            <nav class="flex items-center justify-between">
                <a href="index.html" class="text-xl font-bold text-gray-900">Datasets</a>
                <a href="index.html" class="text-gray-600 hover:text-gray-900">← Back to Home</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-6 py-12">

        <!-- Datasets Grid -->
        <div id="datasets-list" class="grid md:grid-cols-2 lg:grid-cols-1 gap-6">
            <!-- Datasets will be populated here -->
        </div>

        <!-- Loading/Error States -->
        <div id="loading" class="text-center py-8">
            <p class="text-gray-500">Loading datasets...</p>
        </div>
        
        <div id="error" class="text-center py-8 hidden">
            <p class="text-red-500">Failed to load datasets.</p>
        </div>

    </main>

    <script src="datasets.js"></script>
</body>
</html>
