name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bundle markdown write-ups
        run: python3 bundle_markdown.py
      - name: Cache-bust local scripts and stylesheets
        # site.js -> site.js?v=<commit>, so browsers never pair a new page with a stale asset
        run: sed -i -E 's#(src|href)="([a-z_/.-]+\.(js|css))"#\1="\2?v='"${GITHUB_SHA::8}"'"#g' *.html
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
